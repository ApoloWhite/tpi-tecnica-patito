server:
  port: 8084

spring:
  application:
    name: ms-solicitudes
  datasource:
    url: jdbc:h2:file:./data/solicitudes-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers

# URLs de los otros microservicios (los usaremos en la etapa 5)
app:
  clientes:
    base-url: http://localhost:8082
  tecnicos:
    base-url: http://localhost:8083

logging:
  level:
    root: INFO
    utnfc.isi.back.tpi: DEBUG
  file:
    name: logs/ms-solicitudes.log