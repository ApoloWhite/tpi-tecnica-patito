server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador llama a /api/... en el mismo origen (localhost:47300) y nginx lo reenvía al gateway.
    # Así no hacen falta reglas CORS y el gateway sigue siendo el único punto de entrada al backend.
    location /api/ {
        proxy_pass http://api-gateway:47380;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
