server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/bda-realm

app:
  routes:
    clientes-url: http://localhost:8082
    tecnicos-url: http://localhost:8083
    solicitudes-url: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    utnfc.isi.back.tpi: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/api-gateway.log
