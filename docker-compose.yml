# Técnica Patito - Backend completo
#
# Antes de levantar: mvn clean package -DskipTests   (genera los JAR que copian los Dockerfile)
# Desarrollo: docker compose up -d --build           (usa también docker-compose.override.yml)
# Producción: docker compose --file docker-compose.yml up -d --build   (solo publica gateway y Keycloak)

name: tpi-tecnica-patito

# Logs a stdout con rotación (Ap.23, 24)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Variables comunes de seguridad: el token dice que lo emitió localhost:9090 (issuer),
# pero dentro de la red de Docker las claves se bajan de keycloak:8080 (jwk-set-uri).
x-jwt-env: &jwt-env
  KEYCLOAK_ISSUER_URI: http://localhost:9090/realms/patito
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/patito/protocol/openid-connect/certs
  TZ: America/Argentina/Cordoba

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Los tokens siempre dicen "emitido por http://localhost:9090", sin importar desde dónde se piden
      KC_HOSTNAME: http://localhost:9090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      TZ: America/Argentina/Cordoba
    ports:
      - "9090:8080"
    volumes:
      # :z es necesario en Fedora por SELinux
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/patito.json:ro,z
    healthcheck:
      # La imagen de Keycloak no trae curl: se consulta el puerto de management (9000) con bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - tpi-net
    logging: *logging

  ms-clientes:
    build:
      context: ./ms-clientes
    image: tpi-tecnica-patito/ms-clientes:1.0.0
    container_name: ms-clientes
    environment:
      <<: *jwt-env
      H2_DIR: /app/data
    expose:
      - "8083"
    volumes:
      - patito-clientes-data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck: &healthcheck-ms
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - tpi-net
    logging: *logging

  ms-tecnicos:
    build:
      context: ./ms-tecnicos
    image: tpi-tecnica-patito/ms-tecnicos:1.0.0
    container_name: ms-tecnicos
    environment:
      <<: *jwt-env
      H2_DIR: /app/data
    expose:
      - "8082"
    volumes:
      - patito-tecnicos-data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-ms
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
    networks:
      - tpi-net
    logging: *logging

  ms-solicitudes:
    build:
      context: ./ms-solicitudes
    image: tpi-tecnica-patito/ms-solicitudes:1.0.0
    container_name: ms-solicitudes
    environment:
      <<: *jwt-env
      H2_DIR: /app/data
      # Los servicios se hablan por nombre, nunca por localhost (Ap.21)
      CLIENTES_URL: http://ms-clientes:8083
      TECNICOS_URL: http://ms-tecnicos:8082
      GEO_URL: ${GEO_URL:-https://router.project-osrm.org}
      OFERTA_VENTANA_MINUTOS: ${OFERTA_VENTANA_MINUTOS:-15}
      OFERTA_SCHEDULER_MS: ${OFERTA_SCHEDULER_MS:-30000}
    expose:
      - "8081"
    volumes:
      - patito-solicitudes-data:/app/data
    depends_on:
      ms-clientes:
        condition: service_healthy
      ms-tecnicos:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-ms
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
    networks:
      - tpi-net
    logging: *logging

  api-gateway:
    build:
      context: ./api-gateway
    image: tpi-tecnica-patito/api-gateway:1.0.0
    container_name: api-gateway
    environment:
      <<: *jwt-env
      CLIENTES_URL: http://ms-clientes:8083
      TECNICOS_URL: http://ms-tecnicos:8082
      SOLICITUDES_URL: http://ms-solicitudes:8081
    ports:
      # Único punto de entrada al backend
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      ms-clientes:
        condition: service_healthy
      ms-tecnicos:
        condition: service_healthy
      ms-solicitudes:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-ms
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
    networks:
      - tpi-net
    logging: *logging

volumes:
  patito-clientes-data:
  patito-tecnicos-data:
  patito-solicitudes-data:

networks:
  tpi-net:
    name: tpi-net
    driver: bridge
