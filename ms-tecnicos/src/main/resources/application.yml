server:
  port: ${SERVER_PORT:47382}

spring:
  application:
    name: ms-tecnicos
  datasource:
    # H2 en archivo (decisión del equipo). En Docker la carpeta /app/data es un volumen nombrado.
    url: jdbc:h2:file:${H2_DIR:./data}/tecnicos-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer: lo que dice el token (se pide desde el host en localhost:47390)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:47390/realms/patito}
          # jwk-set-uri: de dónde se bajan las claves públicas (en Docker: http://keycloak:8080/...)
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:47390/realms/patito/protocol/openid-connect/certs}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true

info:
  app:
    nombre: ${spring.application.name}
    descripcion: Padrón de técnicos, certificaciones y zonas

app:
  openapi:
    titulo: MS-Técnicos - Técnica Patito
    descripcion: Padrón de técnicos (F3) y búsqueda de candidatos por certificación y cercanía (F5, RN-2, RN-9).
  candidatos:
    # Radio máximo para considerar "cercano" a un técnico (RN-9)
    radio-km: ${CANDIDATOS_RADIO_KM:13.0}

logging:
  pattern:
    correlation: "[cid:%X{correlationId:-}] "
  level:
    root: INFO
    utnfc.isi.back.tpi: DEBUG
